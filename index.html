<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>earth</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div
      id="app"
      class="w-full h-screen overflow-hidden relative bg-black text-white"
    >
      <nav class="w-full py-3 px-6 flex justify-between items-center absolute">
        <span class="text-4xl">Planets</span>
        <button class="cursor-pointer size-10">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-logs preview-icon"
          >
            <path d="M3 5h1" />
            <path d="M3 12h1" />
            <path d="M3 19h1" />
            <path d="M8 5h1" />
            <path d="M8 12h1" />
            <path d="M8 19h1" />
            <path d="M13 5h8" />
            <path d="M13 12h8" />
            <path d="M13 19h8" />
          </svg>
        </button>
      </nav>

      <section class="w-full relative">
        <div
          id="planet-name-container"
          class="w-full h-25 absolute top-20 uppercase"
        ></div>
        <div
          class="w-full h-17.5 overflow-hidden absolute top-20 tracking-tighter text-xl text-center"
          id="planet-desc-container"
        ></div>
      </section>
      <canvas id="canvas"></canvas>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
